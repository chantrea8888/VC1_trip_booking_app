<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/logoBookingTrip.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VC1-trip-booking-app</title>
  </head>
  <body>
    <div id="root" style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 16px;">
      Loading…
    </div>
    <script>
      (function () {
        const root = document.getElementById('root');
        if (!root) return;

        function format(value) {
          try {
            if (value instanceof Error) return value.stack || value.message || String(value);
            if (typeof value === 'string') return value;
            return JSON.stringify(value, null, 2);
          } catch {
            return String(value);
          }
        }

        function showFatal(err) {
          const message = format(err);
          root.innerHTML =
            '<div style="max-width: 900px; margin: 24px auto; border: 1px solid #fecaca; background: #fef2f2; padding: 16px; border-radius: 12px;">' +
            '<h1 style="margin: 0 0 8px; font-size: 16px; font-weight: 800; color: #991b1b;">App failed to start</h1>' +
            '<pre style="margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: #111827;">' +
            message.replace(/</g, '&lt;') +
            '</pre>' +
            '<p style="margin: 12px 0 0; font-size: 12px; color: #6b7280;">Open DevTools Console for more details.</p>' +
            '</div>';
        }

        window.addEventListener('error', (e) => showFatal(e.error || e.message || e));
        window.addEventListener('unhandledrejection', (e) => showFatal(e.reason || e));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
