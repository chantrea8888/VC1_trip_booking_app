name: Deploy Application

on:
  push:
    branches:
      - main

env:
  # This removes the deprecation warning and prepares for the 2026 Node upgrade
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }} # Use a Docker Access Token here!

    - name: Build and Push Backend
      run: |
        # Folder name is capitalized 'Backend' in your screenshot
        docker build -t ${{ secrets.DOCKER_USERNAME }}/booking_app-backend ./Backend
        docker push ${{ secrets.DOCKER_USERNAME }}/booking_app-backend

    - name: Build and Push Frontend
      run: |
        # Folder name is capitalized 'Frontend' in your screenshot
        docker build -t ${{ secrets.DOCKER_USERNAME }}/booking_app-frontend ./Frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/booking_app-frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }} # Content of booking_app.pem
        script: |
          # 1. Pull the latest images from Docker Hub
          docker pull ${{ secrets.DOCKER_USERNAME }}/booking_app-backend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/booking_app-frontend:latest

          # 2. Stop and remove old containers if they exist
          docker stop laravel_backend react_frontend || true
          docker rm laravel_backend react_frontend || true
          
          # 3. Clean up unused images to save disk space
          docker image prune -f

          # 4. Run Backend (Laravel)
          docker run -d \
            --name laravel_backend \
            --restart always \
            -p 9000:9000 \
            ${{ secrets.DOCKER_USERNAME }}/booking_app-backend:latest
          
          # 5. Run Frontend (React/Vite)
          docker run -d \
            --name react_frontend \
            --restart always \
            -p 80:5173 \
            ${{ secrets.DOCKER_USERNAME }}/booking_app-frontend:latest